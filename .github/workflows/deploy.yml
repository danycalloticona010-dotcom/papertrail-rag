name: Import tested source and deploy RAG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import reviewed application source if needed
        id: import_source
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, zipfile, hashlib
          source_hash = hashlib.sha256(Path('bootstrap-source.zip').read_bytes()).hexdigest()
          marker = Path('.source-import.sha256')
          if not marker.exists() or marker.read_text().strip() != source_hash:
              with zipfile.ZipFile('bootstrap-source.zip') as archive:
                  for entry in archive.infolist():
                      path = Path(entry.filename)
                      if path.is_absolute() or '..' in path.parts or path.parts[0] in ('.git', '.github'):
                          raise ValueError('Unexpected archive path')
                  archive.extractall('.')
              marker.write_text(source_hash + '\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('imported=true\n')
          PY
      - run: npm test
      - run: npm run build
      - run: node --check site/app.js
      - run: node --check site/generator.worker.js
      - name: Record reviewed source in the public repository
        if: steps.import_source.outputs.imported == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import tested Papertrail RAG source"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
